name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-imagemagick

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        shell: msys2 {0}
        run: cargo build --release

      - name: Bundle GTK runtime
        shell: msys2 {0}
        run: ./packaging/windows/bundle.sh

      - name: Installer
        shell: pwsh
        run: |
          $env:SKINVAS_VERSION = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q packaging\windows\skinvas.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: skinvas-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Attach to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.exe dist/*.zip --clobber
